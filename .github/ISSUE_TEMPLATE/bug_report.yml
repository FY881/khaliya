name: "🐞 بلاغ خطأ · Bug report"
description: "شيء لا يعمل كما يجب · Something isn't working"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **لا تكتب أي سر هنا** (بذرة TOTP، سرّ الجلسة، مفاتيح API، كوكيز). للثغرات الأمنية راجع SECURITY.md.
        **Never paste secrets here** (TOTP seed, session secret, API keys, cookies). For vulnerabilities see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: "ماذا حدث؟ · What happened?"
      placeholder: "وصف قصير وواضح · A short, clear description"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "خطوات إعادة الإنتاج · Steps to reproduce"
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "المتوقع · Expected behaviour"
  - type: dropdown
    id: area
    attributes:
      label: "الجزء · Area"
      options:
        - "Console / لوحة التحكم"
        - "Agents & runtime / الوكلاء"
        - "Evolution / التطوّر"
        - "Eval Factory / التقييمات"
        - "Tool Forge / المصهر"
        - "Discovery Lab / الاكتشاف"
        - "Red-Team / الفريق الأحمر"
        - "Memory & Court / الذاكرة والمحكمة"
        - "Studio & Army / الاستوديو والجيش"
        - "Governor & auth / الحاكم والدخول"
        - "Other / أخرى"
  - type: textarea
    id: env
    attributes:
      label: "البيئة · Environment"
      placeholder: "local wrangler dev / tests · Node version · browser"
